services:
  # Main application service for integration testing
  fastttsr:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9090:8080"
    environment:
      MODEL_CACHE_DIR: /cache
      ESPEAK_DATA_DIR: /app/assets/espeak-ng-data
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./model-cache:/cache
      - ./assets:/app/assets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Integration test runner
  integration-tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      MODEL_CACHE_DIR: /cache
      ESPEAK_DATA_DIR: /app/assets/espeak-ng-data
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./model-cache:/cache
      - ./assets:/app/assets:ro
      - ./test-results:/src/test-results
    depends_on:
      fastttsr:
        condition: service_healthy
    profiles:
      - test

  # Unit test runner (doesn't need the app running)
  unit-tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    command: ["tests/FastTTSR.Api.Tests/FastTTSR.Api.Tests.csproj"]
    volumes:
      - ./test-results:/src/test-results
    profiles:
      - test

volumes:
  model-cache:
